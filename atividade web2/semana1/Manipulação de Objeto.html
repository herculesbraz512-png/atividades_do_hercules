
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criação e manipulação de objeto</title>
</head>
<body>

    <h1>Cadastro de Carro</h1>

    <label>Marca:</label>
    <input type="text" id="marca" placeholder="Digite a marca">
    <br><br>

    <label>Modelo:</label>
    <input type="text" id="modelo" placeholder="Digite o modelo">
    <br><br>

    <label>Ano:</label>
    <input type="number" id="ano" placeholder="Digite o ano">
    <br><br>

    <button onclick="mostrarCarro()">Mostrar informações</button>

    <p id="resultado"></p>

    <script>

        function mostrarCarro() {

            let carro = {

                marca: document.getElementById("marca").value,
                modelo: document.getElementById("modelo").value,
                ano: document.getElementById("ano").value,

                exibirInfo: function() {

                    return `Marca: ${this.marca} | Modelo: ${this.modelo} | Ano: ${this.ano}`;

                }

            };

            carro.cor = "Preto";
            carro.ano = 2025;

            document.getElementById("resultado").innerHTML =
                carro.exibirInfo();

            console.log(carro);

        }

    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Manipulação de Array</title>
</head>
<body>

    <h1>Manipulação de Array</h1>

    <label>Digite os numeros separados por virgula:</label>
    <br><br>

    <input type="text" id="numeros"
           placeholder="Exemplo: 1, 2, 4, 8">

    <br><br>

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>

        function calcular() {

            let numeros = document.getElementById("numeros").value
                .split(",")
                .map(numero => parseFloat(numero.trim()));

            let maior = Math.max(...numeros);
            let menor = Math.min(...numeros);

            let dobro = numeros.map(numero => numero * 2);

            let maioresQueCinco = numeros.filter(numero => numero > 5);

            document.getElementById("resultado").innerHTML =
                `Numeros: ${numeros}<br><br>` +
                `Maior: ${maior}<br>` +
                `Menor: ${menor}<br><br>` +
                `Dobro: ${dobro}<br><br>` +
                `Numeros maiores que 5: ${maioresQueCinco}`;

        }

    </script>

</body>
</html>
